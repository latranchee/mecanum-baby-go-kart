name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # Pinned to the version used locally; bump deliberately.
      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      # Pure-logic host tests: test_math (kinematics, governor, body loop, curve,
      # crc8, packet size) and test_safety (link gate, drive fault, stick calibration,
      # arming, mode-click gesture).
      - name: Host unit tests
        run: pio test -e native

      # Compile firmware. No secrets.h on a fresh checkout — protocol.h falls back
      # to a default MAC, ESPNOW_ENCRYPT defaults 0, so both build clean. The ESP32
      # platform is pinned in platformio.ini ([esp32]); CI needs that pin.
      # headset env is omitted on purpose: it's parked, and its platform is not pinned.
      - name: Build robot firmware
        run: pio run -e robot

      - name: Build controller firmware
        run: pio run -e controller
