[platformio]
default_envs = robot

[env]
framework = arduino
monitor_speed = 115200

[env:robot]
platform = espressif32
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=3
build_src_filter = +<robot/> -<controller/>
upload_protocol = esptool
upload_port = COM8
monitor_port = COM8

[env:controller]
platform = espressif32
board = m5stack-atoms3
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified @ ^0.2.5
build_src_filter = +<controller/> -<robot/>
upload_protocol = esptool
upload_port = COM6
monitor_port = COM6
