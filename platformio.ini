[platformio]
default_envs = robot

[env]
framework = arduino
monitor_speed = 115200

; ESP32 platform, pinned. The firmware needs Arduino core 3.x (ledcAttach, the
; esp_now_recv_info_t / wifi_tx_info_t callbacks, driver/pulse_cnt.h), which only
; the pioarduino platform ships. A bare `platform = espressif32` resolves to
; whatever is installed: pioarduino on a dev machine that has it, but the
; registry's platformio/espressif32 on a fresh one (CI), and that still ships core
; 2.0.17, so the build fails there. An exact release keeps local and CI identical.
[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip

; Host unit tests for the pure logic headers (no Arduino, no hardware).
;   pio test -e native
[env:native]
platform = native
framework =               ; override the arduino framework inherited from [env]
test_framework = unity
build_flags = -std=gnu++17
build_src_filter = -<*>   ; tests pull headers from include/ directly

[env:robot]
platform = ${esp32.platform}
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=3
build_src_filter = +<robot/> -<controller/>
upload_protocol = esptool
upload_port = COM8
monitor_port = COM8

[env:controller]
platform = ${esp32.platform}
board = m5stack-atoms3
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified @ ^0.2.5
build_src_filter = +<controller/> -<robot/>
upload_protocol = esptool
upload_port = COM6
monitor_port = COM6

; Head-tilt controller: Waveshare ESP32-S3-LCD-1.69 (ST7789V2 240x280 + QMI8658 IMU)
; Drop-in ESP-NOW transmitter -> robot (same CtrlPacket/MAC/channel). Robot fw unchanged.
[env:headset]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    lewisxhe/SensorLib @ ^0.2.0
    moononournation/GFX Library for Arduino @ ^1.4.9
build_src_filter = +<headset/> -<robot/> -<controller/>
upload_protocol = esptool
upload_port = COM7
monitor_port = COM7
